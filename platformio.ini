[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    esp32async/ESPAsyncWebServer@^3.11.0
    bblanchon/ArduinoJson@^7.2.2

[env:nikdi]
board = m5stack-core2
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@^0.2.14

[env:artonyx]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43